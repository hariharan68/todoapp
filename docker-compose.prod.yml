# Production stack: Postgres + API + nginx/SPA.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only the web container publishes a port. Postgres and the API are reachable
# only on the internal compose network, so neither is exposed to the internet
# even if the host firewall is misconfigured.
#
# Values come from a .env file next to this one — see .env.production.example.

name: ai-todo

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
      # Without this, a restore into a differently-collated cluster can fail.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No `ports:` on purpose. To inspect the database, tunnel in:
    #   docker compose -f docker-compose.prod.yml exec postgres psql -U $POSTGRES_USER -d $POSTGRES_DB
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-todo_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # The SPA is served from the same origin and proxied through nginx, so no
      # cross-origin request is ever made. Set this only if you also serve the
      # frontend from a different origin.
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # The app writes nothing to disk; a read-only root filesystem removes a
    # whole class of post-compromise persistence. /tmp stays writable because
    # Python and its libraries expect a scratch directory.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default_logging

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin: the browser calls /api on whatever host served the page.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Bind to all interfaces on the chosen host port. If you terminate TLS
      # with something else on the host, change this to 127.0.0.1:8080:80 so
      # only that proxy can reach it.
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging: *default_logging

volumes:
  pgdata:
