# Security headers, kept in their own file because nginx's `add_header` is not
# inherited by any location that declares an `add_header` of its own. Every such
# location must `include` this file, or it silently serves no security headers.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# script-src stays 'self': the Vite build emits external, hash-named bundles and
# no inline script. style-src needs 'unsafe-inline' because React sets element
# style attributes at runtime. connect-src is 'self' because the API is proxied
# through this same origin at /api.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

# Uncomment once TLS terminates in front of this container. Sending HSTS over
# plain HTTP would pin browsers to a scheme that isn't being served.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
