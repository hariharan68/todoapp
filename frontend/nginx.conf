# Production front door: serves the built SPA and proxies /api to the backend.
#
# Because the API is reached through the same origin as the page, the browser
# never makes a cross-origin request — CORS stops being part of production at
# all, and the API container needs no published port of its own.
#
# This file is mounted into /etc/nginx/conf.d/, which nginx includes inside its
# `http` block, so http-level directives (limit_req_zone, upstream) are valid.

# Brute-force protection for the credential endpoints. Enforced in nginx rather
# than in the app because it then holds regardless of how many uvicorn workers
# are running — an in-process limiter would allow N times the configured rate.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
# A broader ceiling for the rest of the API.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

upstream backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # If you put another proxy, load balancer, or Cloudflare in front of this
    # container, uncomment these and set the trusted source to that proxy's
    # network. Without it every client looks like the proxy's single IP, which
    # makes the rate limits above global instead of per-client, and access logs
    # useless. With it, $remote_addr becomes the real client everywhere.
    #
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # Don't advertise the exact nginx version in error pages and headers.
    server_tokens off;

    # Requests are JSON only; nothing here needs a large body.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    include /etc/nginx/security-headers.conf;

    # ---- container healthcheck ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API proxy ----
    # The trailing slash on proxy_pass strips the /api prefix, so /api/tasks/
    # reaches the backend as /tasks/.
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        # The AI endpoints call Claude and can legitimately take a while; a
        # short read timeout would turn a slow answer into a 504.
        proxy_read_timeout 120s;

        proxy_buffering off;
    }

    # Tighter limit on the endpoints that accept credentials. 10 requests per
    # minute per IP with a small burst is generous for a human and useless for
    # password spraying. These are exact-match locations, so they take
    # precedence over the /api/ prefix above.
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/signup {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend/auth/signup;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- static assets ----
    # Vite fingerprints these filenames, so a far-future immutable cache is safe
    # and a deploy invalidates them by changing the name.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        # One directive, not `expires` plus `add_header` — `expires` emits its
        # own Cache-Control and the response would carry the header twice.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or browsers keep loading the old bundle
    # names after a deploy.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- SPA fallback ----
    # Client-side routes (/tasks, /chat, ...) are not files on disk; serve the
    # app shell and let React Router resolve them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
